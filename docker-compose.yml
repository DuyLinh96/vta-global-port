services:
  web:
    image: docker.io/linhnguyen96/vta-global-port:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status) }).catch(e => { console.error(e); process.exit(1) })"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
